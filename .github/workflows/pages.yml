name: pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate static status page
        run: |
          mkdir -p _site
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          cat <<EOF > _site/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>DATAEKO Capstone — Coffee Company Status</title>
            <style>
              :root {
                --bg: #0d1117;
                --surface: #161b22;
                --border: #30363d;
                --text: #c9d1d9;
                --heading: #f0f6fc;
                --primary: #58a6ff;
                --accent: #238636;
                --accent-amber: #d29922;
                --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
              }
              body {
                font-family: var(--font);
                background-color: var(--bg);
                color: var(--text);
                margin: 0;
                padding: 40px 20px;
                display: flex;
                flex-direction: column;
                align-items: center;
              }
              .container {
                max-width: 900px;
                width: 100%;
              }
              header {
                text-align: center;
                margin-bottom: 40px;
                border-bottom: 1px solid var(--border);
                padding-bottom: 24px;
              }
              h1 {
                color: var(--heading);
                font-size: 2.2rem;
                margin: 0 0 12px 0;
              }
              .badge-container {
                display: flex;
                justify-content: center;
                gap: 12px;
                flex-wrap: wrap;
                margin-top: 16px;
              }
              .badge {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 20px;
                padding: 6px 14px;
                font-size: 0.9rem;
              }
              .badge strong { color: var(--primary); }
              .grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
                gap: 20px;
                margin-bottom: 30px;
              }
              .card {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 8px;
                padding: 20px;
              }
              .card h2 {
                color: var(--heading);
                font-size: 1.15rem;
                margin-top: 0;
                border-bottom: 1px solid var(--border);
                padding-bottom: 8px;
              }
              .metric {
                font-size: 2rem;
                font-weight: bold;
                color: var(--primary);
                margin: 8px 0;
              }
              ul { padding-left: 20px; margin: 0; }
              li { margin-bottom: 6px; }
              a {
                color: var(--primary);
                text-decoration: none;
              }
              a:hover { text-decoration: underline; }
              footer {
                text-align: center;
                margin-top: 40px;
                font-size: 0.85rem;
                color: #8b949e;
              }
            </style>
          </head>
          <body>
            <div class="container">
              <header>
                <h1>☕ DATAEKO Coffee Co. Data Pipeline</h1>
                <p>Five-week end-to-end data platform internship capstone.</p>
                <div class="badge-container">
                  <span class="badge">Engineer: <strong>Shivang Gupta</strong></span>
                  <span class="badge">GitHub: <strong>@shivanggupta998</strong></span>
                  <span class="badge">Status: <strong style="color: #3fb950;">All Systems Verified</strong></span>
                </div>
              </header>

              <div class="grid">
                <div class="card">
                  <h2>📊 Database Row Counts</h2>
                  <ul>
                    <li><strong>Orders:</strong> 400,000</li>
                    <li><strong>Deliveries:</strong> 320,000</li>
                    <li><strong>Customers:</strong> 20,000</li>
                    <li><strong>Drinks:</strong> 18</li>
                    <li><strong>Stores:</strong> 6</li>
                  </ul>
                </div>

                <div class="card">
                  <h2>🔍 Q2 & Q3 Anti-Joins</h2>
                  <p><strong>Drinks Never Ordered (3):</strong></p>
                  <ul>
                    <li>Turmeric Latte</li>
                    <li>Rose Cardamom</li>
                    <li>Affogato</li>
                  </ul>
                  <p style="margin-top: 12px;"><strong>Undelivered Orders:</strong> 80,000 (20%)</p>
                </div>

                <div class="card">
                  <h2>🏙️ Q1 Revenue By City</h2>
                  <ul>
                    <li><strong>Bengaluru:</strong> ₹15,592,590</li>
                    <li><strong>Hyderabad:</strong> ₹15,591,930</li>
                    <li><strong>Chennai:</strong> ₹9,328,900</li>
                    <li><strong>Pune:</strong> ₹9,328,660</li>
                    <li><strong>Delhi:</strong> ₹4,664,450</li>
                    <li><strong>Mumbai:</strong> ₹4,664,100</li>
                  </ul>
                </div>

                <div class="card">
                  <h2>⭐ Q4 Loyal Customers (>25)</h2>
                  <p><strong>Top Customer:</strong> customer_5291</p>
                  <ul>
                    <li><strong>Order Count:</strong> 28 orders</li>
                    <li><strong>Total Spend:</strong> ₹9,020 INR</li>
                  </ul>
                </div>
              </div>

              <div class="card">
                <h2>📦 Production Container Artifact</h2>
                <p>Published GHCR Package: <a href="https://github.com/ShivangGupta998/dataeko-capstone/pkgs/container/dataeko-capstone" target="_blank">ghcr.io/shivanggupta998/dataeko-capstone:latest</a></p>
                <code>docker pull ghcr.io/shivanggupta998/dataeko-capstone:latest</code>
              </div>

              <footer>
                Generated automatically by GitHub Actions workflow • Built at: $BUILD_DATE
              </footer>
            </div>
          </body>
          </html>
          EOF
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
